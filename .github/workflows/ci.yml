name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main
      - 'codex/**'

jobs:
  build-test:
    name: Restore, build, test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\GestureClip.sln

      - name: Build
        run: dotnet build .\GestureClip.sln -c Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          . .\scripts\build-common.ps1
          Invoke-DotNetTests (Get-DotNetSdk) @('test', '.\GestureClip.sln', '-c', 'Release', '--no-build', '--no-restore', '--verbosity', 'normal')

      - name: Test release and installer tools
        shell: powershell
        run: |
          .\scripts\tests\Test-ReleaseVerification.ps1
          .\scripts\tests\Test-InstallCommand.ps1
