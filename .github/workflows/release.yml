name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build Windows x64 package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Configure signing (optional)
        shell: pwsh
        env:
          GESTURECLIP_SIGN_PFX_BASE64: ${{ secrets.GESTURECLIP_SIGN_PFX_BASE64 }}
          GESTURECLIP_SIGN_PASSWORD: ${{ secrets.GESTURECLIP_SIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GESTURECLIP_SIGN_PFX_BASE64)) {
            Write-Host "No signing certificate configured; skipping."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "gestureclip-codesign.pfx"
          $bytes = [Convert]::FromBase64String($env:GESTURECLIP_SIGN_PFX_BASE64)
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          "GESTURECLIP_SIGN_PFX=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Setup package
        shell: pwsh
        env:
          GESTURECLIP_SIGN_PASSWORD: ${{ secrets.GESTURECLIP_SIGN_PASSWORD }}
        run: .\scripts\build-setup.ps1

      - name: Verify release artifacts
        shell: pwsh
        run: .\scripts\check-release.ps1 -RequireSetup

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "gestureclip-codesign.pfx"
          if (Test-Path -LiteralPath $pfxPath) {
            Remove-Item -LiteralPath $pfxPath -Force
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestureClip-win-x64
          path: |
            artifacts/release/*.zip
            artifacts/release/*.exe
            artifacts/release/SHA256SUMS.txt

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release/*.zip
            artifacts/release/*.exe
            artifacts/release/SHA256SUMS.txt
          generate_release_notes: true
